---
# ==============================================================================
# SPRINT 7: ENTERPRISE APPLICATION DEPLOYMENT (GitOps via Ansible)
# Target: All 24/7 Home Servers (specifically mew@homelab / Ubuntu 24.04 LTS)
# ==============================================================================

- name: 🚀 Sprint 7 - Application Deployment (Docker Compose)
  hosts: home_servers
  become: false
  gather_facts: false

  tasks:
    - name: 📂 Ensure /data/docker directory exists with correct permissions
      ansible.builtin.file:
        path: /data/docker
        state: directory
        owner: mew
        group: mew
        mode: '0775'
      become: true

    - name: 🔧 Ensure /data/docker is writable by mew user (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker:/data alpine chown -R 1000:1000 /data
      changed_when: false

    - name: 🔄 Synchronize docker configuration files from Git repository
      ansible.builtin.copy:
        src: ../../docker/
        dest: /data/docker/
        owner: mew
        group: mew
        mode: '0664'
        directory_mode: '0775'

    - name: 🔐 Check if .env file exists on the server (Secrets)
      ansible.builtin.stat:
        path: /data/docker/.env
      register: env_file

    - name: ⚠️ WARNING - .env file missing!
      ansible.builtin.debug:
        msg: "WARNING: /data/docker/.env does not exist on the server. Your containers may fail to start without secrets (VAULTWARDEN_ADMIN_TOKEN, etc). Please ensure .env is created securely."
      when: not env_file.stat.exists

    - name: 🔧 Fix Grafana Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/grafana/data:/data alpine chown -R 472:0 /data
      changed_when: false

    - name: 🔧 Fix pgAdmin Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/pgadmin/data:/data alpine chown -R 5050:5050 /data
      changed_when: false

    - name: 🔧 Fix PostgreSQL Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/postgres/data:/data alpine chown -R 70:70 /data
      changed_when: false

    - name: 🔧 Fix Redis Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/redis/data:/data alpine chown -R 999:999 /data
      changed_when: false
      failed_when: false

    - name: 🔧 Fix Authelia Config Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/authelia/config:/config alpine chown -R 1000:1000 /config
      changed_when: false
      failed_when: false

    - name: 🔧 Ensure Nextcloud Directories Exist & Fix Permissions (UID 33:33 www-data)
      ansible.builtin.command:
        cmd: >
          docker run --rm
          -v /ssd-data/docker/nextcloud/html:/html
          -v /data/docker/nextcloud/data:/data
          alpine sh -c "mkdir -p /html /data && chown -R 33:33 /html /data"
      changed_when: false
      failed_when: false

    - name: 🔐 Reset AdGuard Home Password to admin123 (via Docker)
      ansible.builtin.command:
        cmd: "docker run --rm -v /data/docker/adguardhome/conf/AdGuardHome.yaml:/app/AdGuardHome.yaml alpine sed -i -E 's/(password: ).*/\\1$2a$10$vI8aWBnW3fID.ZQ4\\/zo1G.q1lRps.9cGLcZEiGDMVr5yUP1KUOYTa/' /app/AdGuardHome.yaml"
      changed_when: false
      failed_when: false

    - name: 🐳 Deploy Unified Production Stack via Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --pull always --remove-orphans
        chdir: /data/docker
      register: compose_output
      changed_when: "'Started' in compose_output.stdout or 'Recreated' in compose_output.stdout or 'Created' in compose_output.stdout"

    - name: 🔄 Restart AdGuard Home to clear rate limit
      ansible.builtin.command:
        cmd: docker compose restart adguardhome
        chdir: /data/docker
      changed_when: false

    - name: 📊 Display Docker Compose Output
      ansible.builtin.debug:
        var: compose_output.stdout_lines
