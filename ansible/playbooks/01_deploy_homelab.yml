---
# ==============================================================================
# SPRINT 7: ENTERPRISE APPLICATION DEPLOYMENT (GitOps via Ansible)
# Target: All 24/7 Home Servers (specifically mew@homelab / Ubuntu 24.04 LTS)
# ==============================================================================

- name: 🚀 Sprint 7 - Application Deployment (Docker Compose)
  hosts: home_servers
  become: false
  gather_facts: false

  tasks:
    - name: 📂 Ensure /data/docker directory exists with correct permissions
      ansible.builtin.file:
        path: /data/docker
        state: directory
        owner: mew
        group: mew
        mode: '0775'
      become: true

    - name: 🛡️ Preflight Census Guard for ACASH UID/GID 10001 (O6)
      ansible.builtin.shell: |
        set -e
        CONFLICT_USER=$(awk -F: '$3 == 10001 {print $1}' /etc/passwd || true)
        CONFLICT_GROUP=$(awk -F: '$3 == 10001 {print $1}' /etc/group || true)
        if [ -n "$CONFLICT_USER" ] && [ "$CONFLICT_USER" != "paper" ]; then
          echo "COLLISION: UID 10001 occupied by host user '$CONFLICT_USER'. STOP and report (O6)." >&2
          exit 1
        fi
        if [ -n "$CONFLICT_GROUP" ] && [ "$CONFLICT_GROUP" != "paper" ]; then
          echo "COLLISION: GID 10001 occupied by host group '$CONFLICT_GROUP'. STOP and report (O6)." >&2
          exit 1
        fi
        echo "CENSUS GUARD PASS: UID/GID 10001 is unallocated or assigned to paper."
      become: true
      changed_when: false

    - name: 🔧 Ensure /data/docker subdirectories are writable by mew user (excluding ACASH)
      ansible.builtin.command:
        cmd: >
          docker run --rm -v /data/docker:/data alpine sh -c
          "find /data -mindepth 1 -maxdepth 1 ! -name 'acash' -exec chown -R 1000:1000 {} +"
      changed_when: false

    - name: 🧹 Remove mistakenly created directories for single-file Docker volume mounts
      ansible.builtin.shell: |
        if [ -d "/data/docker/pgadmin/config/servers.json" ]; then
          rm -rf "/data/docker/pgadmin/config/servers.json"
        fi
        if [ -d "/data/docker/prometheus/config/prometheus.yml" ]; then
          rm -rf "/data/docker/prometheus/config/prometheus.yml"
        fi
        if [ -d "/data/docker/adguardhome/conf/AdGuardHome.yaml" ]; then
          rm -rf "/data/docker/adguardhome/conf/AdGuardHome.yaml"
        fi
      become: true
      changed_when: false

    - name: 🔄 Synchronize docker configuration files from Git repository
      ansible.builtin.copy:
        src: ../../docker/
        dest: /data/docker/
        owner: mew
        group: mew
        mode: '0664'
        directory_mode: '0775'

    - name: 🔐 Check if .env file exists on the server (Secrets)
      ansible.builtin.stat:
        path: /data/docker/.env
      register: env_file

    - name: ⚠️ WARNING - .env file missing!
      ansible.builtin.debug:
        msg: "WARNING: /data/docker/.env does not exist on the server. Your containers may fail to start without secrets (VAULTWARDEN_ADMIN_TOKEN, etc). Please ensure .env is created securely."
      when: not env_file.stat.exists

    - name: 🔧 Fix Grafana Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/grafana/data:/data alpine chown -R 472:0 /data
      changed_when: false

    - name: 🔧 Fix pgAdmin Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/pgadmin/data:/data alpine chown -R 5050:5050 /data
      changed_when: false

    - name: 🔧 Fix PostgreSQL Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/postgres/data:/data alpine chown -R 70:70 /data
      changed_when: false

    - name: 🔧 Fix Redis Data Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/redis/data:/data alpine chown -R 999:999 /data
      changed_when: false
      failed_when: false

    - name: 🔧 Fix Authelia Config Directory Permissions (via Docker)
      ansible.builtin.command:
        cmd: docker run --rm -v /data/docker/authelia/config:/config alpine chown -R 1000:1000 /config
      changed_when: false
      failed_when: false

    - name: 🔧 Ensure Nextcloud Directories Exist & Fix Permissions (UID 33:33 www-data)
      ansible.builtin.command:
        cmd: >
          docker run --rm
          -v /ssd-data/docker/nextcloud/html:/html
          -v /data/docker/nextcloud/data:/data
          alpine sh -c "mkdir -p /html /data && chown -R 33:33 /html /data"
      changed_when: false
      failed_when: false

    - name: 🔐 Reset AdGuard Home Password to admin123
      ansible.builtin.shell: |
        if [ -f "/data/docker/adguardhome/conf/AdGuardHome.yaml" ]; then
          sed -i -E 's/(password: ).*/\1$2a$10$vI8aWBnW3fID.ZQ4\/zo1G.q1lRps.9cGLcZEiGDMVr5yUP1KUOYTa/' /data/docker/adguardhome/conf/AdGuardHome.yaml
        fi
      become: true
      changed_when: false
      failed_when: false

    - name: 🔍 Check if ACASH persistent root exists (/data/docker/acash)
      ansible.builtin.stat:
        path: /data/docker/acash
      register: acash_root_stat

    - name: 🔧 Ensure ACASH Persistent Root Permissions (UID/GID 10001:10001, O6)
      ansible.builtin.command:
        cmd: >
          docker run --rm -v /data/docker/acash:/data alpine sh -c
          "chown -R 10001:10001 /data && chmod -R 0770 /data"
      when: acash_root_stat.stat.exists
      changed_when: false

    - name: 🐳 Deploy Unified Production Stack via Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --pull always --remove-orphans
        chdir: /data/docker
      register: compose_output
      changed_when: "'Started' in compose_output.stdout or 'Recreated' in compose_output.stdout or 'Created' in compose_output.stdout"

    - name: 🔄 Restart AdGuard Home to clear rate limit
      ansible.builtin.command:
        cmd: docker compose restart adguardhome
        chdir: /data/docker
      changed_when: false

    - name: 📊 Display Docker Compose Output
      ansible.builtin.debug:
        var: compose_output.stdout_lines
