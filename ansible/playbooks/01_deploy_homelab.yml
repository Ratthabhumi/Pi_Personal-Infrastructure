---
- name: Restore explicitly approved telemetry on verified existing storage
  hosts: home_servers
  become: false
  gather_facts: false
  tasks:
    - name: Require explicit authority and exact storage and config identity
      ansible.builtin.assert:
        that:
          - homelab_restore_authorized | default(false) | bool
          - homelab_storage_uuid | default('') is match('^[a-fA-F0-9-]{36}$')
          - homelab_compose_sha256 | default('') is match('^[a-fA-F0-9]{64}$')
          - homelab_services | default([]) | length > 0
          - homelab_services | default([]) | difference(['victoriametrics', 'node-exporter']) | length == 0
        fail_msg: Inspect data/secrets and approve exact UUID, compose digest and telemetry first. ACASH and application restores need separate scope.

    - name: Read the actual data mount without creating it
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, /data, --json, --output, 'UUID,FSTYPE,OPTIONS']
      register: data_mount
      changed_when: false

    - name: Require the approved writable ext4 filesystem at the exact mountpoint
      ansible.builtin.assert:
        that:
          - (data_mount.stdout | from_json).filesystems | length == 1
          - (data_mount.stdout | from_json).filesystems[0].uuid == homelab_storage_uuid
          - (data_mount.stdout | from_json).filesystems[0].fstype == 'ext4'
          - "'rw' in (data_mount.stdout | from_json).filesystems[0].options.split(',')"

    - name: Inspect existing compose identity
      ansible.builtin.stat:
        path: /data/docker/compose.yaml
        checksum_algorithm: sha256
      register: restored_compose

    - name: Inspect private secrets metadata without reading values
      ansible.builtin.stat:
        path: /data/docker/.env
      register: restored_secrets
      no_log: true

    - name: Require existing reviewed compose and private secrets
      ansible.builtin.assert:
        that:
          - restored_compose.stat.isreg | default(false)
          - not (restored_compose.stat.islnk | default(false))
          - restored_compose.stat.checksum | default('') == homelab_compose_sha256
          - restored_secrets.stat.isreg | default(false)
          - not (restored_secrets.stat.islnk | default(false))
          - restored_secrets.stat.mode | default('') in ['0400', '0600']
      no_log: true

    - name: Validate compose without printing interpolated secrets
      ansible.builtin.command:
        argv: [docker, compose, --file, /data/docker/compose.yaml, config, --quiet]
        chdir: /data/docker
      changed_when: false
      no_log: true

    - name: Start only approved telemetry using existing images and no dependencies
      ansible.builtin.command:
        argv: "{{ ['docker', 'compose', '--file', '/data/docker/compose.yaml', 'up', '--detach', '--no-deps', '--pull', 'never'] + homelab_services }}"
        chdir: /data/docker
      register: compose_output
      changed_when: >-
        'Started' in compose_output.stderr or 'Created' in compose_output.stderr
        or 'Recreated' in compose_output.stderr
      no_log: true
