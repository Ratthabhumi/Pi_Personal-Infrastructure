name: Debug Server
on:
  push:
    paths:
      - 'debug.txt'
jobs:
  debug:
    runs-on: self-hosted
    steps:
      - name: Expand LVM via Docker
        run: |
          echo "Expanding LVM..."
          docker run --rm --privileged -v /dev:/dev -v /run:/run ubuntu sh -c "apt-get update && apt-get install -y lvm2 e2fsprogs && lvextend -l +100%FREE /dev/mapper/ubuntu--vg-ubuntu--lv && resize2fs /dev/mapper/ubuntu--vg-ubuntu--lv"
          df -h /
