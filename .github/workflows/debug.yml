name: Debug Server
on:
  push:
    paths:
      - 'debug.txt'
jobs:
  debug:
    runs-on: self-hosted
    steps:
      - name: Expand LVM via chroot
        run: |
          docker run --rm --privileged -v /:/host alpine chroot /host sh -c "lvextend -l +100%FREE /dev/mapper/ubuntu--vg-ubuntu--lv && resize2fs /dev/mapper/ubuntu--vg-ubuntu--lv"
          df -h /
