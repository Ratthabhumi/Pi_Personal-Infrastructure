name: Debug Server
on:
  push:
    paths:
      - 'debug.txt'
jobs:
  debug:
    runs-on: self-hosted
    steps:
      - name: Expand LVM
        run: |
          echo "Testing sudo..."
          sudo -n lvextend -l +100%FREE /dev/mapper/ubuntu--vg-ubuntu--lv || echo "sudo failed"
          sudo -n resize2fs /dev/mapper/ubuntu--vg-ubuntu--lv || echo "resize2fs failed"
          df -h /
