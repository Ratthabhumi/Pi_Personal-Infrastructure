name: Debug Server
on:
  push:
    paths:
      - 'debug.txt'
jobs:
  debug:
    runs-on: self-hosted
    steps:
      - name: Reset Portainer Password
        run: |
          docker stop portainer
          docker run --rm -v /data/docker/portainer/data:/data portainer/helper-reset-password > portainer_reset.log || true
          docker start portainer
          cat portainer_reset.log
          df -h /
