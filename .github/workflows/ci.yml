name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Linters (Yamllint & Ansible-lint)
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint

      - name: 📝 Lint YAML Files (Docker Compose)
        run: yamllint docker/compose.yaml

      - name: ⚙️ Lint Ansible Playbooks
        run: ansible-lint ansible/playbooks/*.yml

      - name: Test recovery safety without root or real disk mounts
        run: python -m unittest discover -s tests -p 'test_recovery*.py' -v

      - name: Validate Ansible syntax
        run: |
          ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/00_bootstrap_server.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/01_deploy_homelab.yml --syntax-check

      - name: Validate compose without printing interpolated secrets
        run: |
          docker compose -f docker/compose.yaml config --quiet --no-interpolate
          docker compose -f docker/compose.minimal.yaml config --quiet
          bash -n scripts/recovery/provision_foundation.sh
          bash -n scripts/recovery/finalize_host_24x7.sh
