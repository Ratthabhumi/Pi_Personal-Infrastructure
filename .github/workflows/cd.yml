name: Recovery deployment gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Require inspected storage and interactive owner authority
        run: >-
          echo 'Automatic self-hosted deployment is disabled.
          Use the controlled playbook after exact storage/config review;
          never provision passwordless sudo for this workflow.'
