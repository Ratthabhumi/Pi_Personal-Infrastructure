# ==============================================================================
# AUTOMATIC GRAFANA DATASOURCE PROVISIONING
# Location: docker/observability/grafana-provisioning/datasources/datasource.yml
# ==============================================================================
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428 # Internal Docker network hostname
    isDefault: true
    editable: true
    version: 1
    jsonData:
      timeInterval: "15s"
