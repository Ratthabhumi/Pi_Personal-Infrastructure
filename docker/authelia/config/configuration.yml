---
###############################################################
#             Authelia Configuration for Homelab              #
###############################################################

theme: dark

server:
  address: "tcp://0.0.0.0:9091"
  buffers:
    read: 4096
    write: 4096
  endpoints:
    enable_pprof: false
    enable_expvars: false

log:
  level: info
  format: text

telemetry:
  metrics:
    enabled: false

totp:
  issuer: "mew.lab"
  period: 30
  skew: 1

webauthn:
  disable: false
  display_name: "Homelab IAM"
  attestation_conveyance_preference: "none"
  user_verification: "preferred"
  timeout: "60s"

authentication_backend:
  password_reset:
    disable: false
  refresh_interval: "5m"
  file:
    path: "/config/users_database.yml"
    password:
      algorithm: "argon2"
      argon2:
        variant: "argon2id"
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: "one_factor"
  rules:
    - domain: "auth.mew.lab"
      policy: "bypass"
    - domain: "*.mew.lab"
      policy: "one_factor"

session:
  name: "authelia_session"
  same_site: "lax"
  inactivity: "45m"
  expiration: "12h"
  remember_me: "1M"
  cookies:
    - domain: "mew.lab"
      authelia_url: "http://auth.mew.lab"
      default_redirection_url: "http://home.mew.lab"
  redis:
    host: "redis"
    port: 6379
    password: "${REDIS_PASSWORD:-admin123}"
    database_index: 1

storage:
  postgres:
    address: "tcp://postgres:5432"
    database: "homelab"
    schema: "public"
    username: "${POSTGRES_USER:-admin}"
    password: "${POSTGRES_PASSWORD:-admin123}"
    timeout: "5s"

notifier:
  filesystem:
    filename: "/config/notification.txt"
