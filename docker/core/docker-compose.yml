# ==============================================================================
# SPRINT 2: CORE EDGE ROUTING, ZERO-TRUST GATEWAY & CONTAINER CONTROL PLANE
# Location: docker/core/docker-compose.yml
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. TRAEFIK v3 - Dynamic Reverse Proxy & Edge Router
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"       # Standard HTTP edge ingress
      - "443:443"     # Secure HTTPS SSL termination ingress
      - "8080:8080"   # Traefik Web Dashboard & API (Accessible securely within network)
    environment:
      - TZ=Asia/Bangkok
    volumes:
      # Read-only Docker Socket connection (Enables dynamic route discovery safely)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-only Tailscale Socket connection (Enables automatic Tailscale SSL Cert generation)
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      # Persistent storage for generated Let's Encrypt / Tailscale certificates & dynamic configs
      - ./traefik-data:/etc/traefik/acme
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--accesslog=true"
    networks:
      - homelab_mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.${LOCAL_DOMAIN:-homelab.ts.net}`)"
      - "traefik.http.routers.traefik-dash.entrypoints=web,websecure"
      - "traefik.http.routers.traefik-dash.service=api@internal"

  # ----------------------------------------------------------------------------
  # 2. PORTAINER CE - Visual Container & Multi-Node Cluster Orchestration UI
  # ----------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.21.5
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"     # Direct administrative HTTP UI (Fail-safe management)
      - "9443:9443"     # Direct administrative HTTPS UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    environment:
      - TZ=Asia/Bangkok
    networks:
      - homelab_mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${LOCAL_DOMAIN:-homelab.ts.net}`) || Host(`portainer.homelab`)"
      - "traefik.http.routers.portainer.entrypoints=web,websecure"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  # ----------------------------------------------------------------------------
  # 3. WATCHTOWER - Autonomous SRE Container Patching & Maintenance Engine
  # ----------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Required to inspect and cleanly replace outdated running container tags
    environment:
      - TZ=Asia/Bangkok
      - DOCKER_API_VERSION=1.44                      # Override Go SDK legacy version 1.25 to meet modern Docker v27+ API requirement (>= 1.40)
      - WATCHTOWER_CLEANUP=true                      # Immediately prune and delete obsolete container images after update
      - WATCHTOWER_INCLUDE_RESTARTING=true           # Attempt to self-heal stuck/restarting containers if an image patch exists
      - WATCHTOWER_SCHEDULE=0 0 4 * * *              # Execute audit & patching daily at exactly 04:00 AM off-peak hours
    networks:
      - homelab_mesh
    labels:
      - "traefik.enable=false"                       # Background daemon worker without public UI exposure

# ==============================================================================
# VOLUMES & OVERLAY NETWORKING
# ==============================================================================
volumes:
  portainer_data:
    name: portainer_core_data

networks:
  homelab_mesh:
    name: homelab_mesh
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
