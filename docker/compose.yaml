networks:
  proxy:
    name: homelab_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  internal:
    name: homelab_internal
    driver: bridge
    internal: true

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "8080:8080"
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /data/docker/traefik/data:/etc/traefik/acme
      - /data/docker/traefik/config:/etc/traefik/conf.d:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.network=homelab_proxy"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.tsresolver.tailscale=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    networks:
      - proxy
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.mew.lab`)"
      - "traefik.http.routers.traefik-dash.service=api@internal"

  portainer:
    image: portainer/portainer-ce:2.21.5
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/docker/portainer/data:/data
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.mew.lab`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /data/docker/victoriametrics/data:/victoria-metrics-data
      - /data/docker/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-promscrape.config.strictParse=false"
      - "-retentionPeriod=1"
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vmetrics.rule=Host(`vmetrics.mew.lab`)"
      - "traefik.http.services.vmetrics.loadbalancer.server.port=8428"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - /data/docker/grafana/data:/var/lib/grafana
      - /data/docker/grafana/config/provisioning:/etc/grafana/provisioning:ro
    networks:
      - proxy
      - internal
    depends_on:
      - victoriametrics
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.mew.lab`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - WEBSOCKET_ENABLED=true
    volumes:
      - /data/docker/vaultwarden/data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`homelab.tail35e4b4.ts.net`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=tsresolver"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3001:3000/tcp"
      - "8081:80/tcp"
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - /data/docker/adguardhome/conf:/opt/adguardhome/conf
      - /ssd-data/adguardhome/work:/opt/adguardhome/work
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.mew.lab`)"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
    networks:
      - proxy
    labels:
      - "traefik.enable=false"

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /data/docker/uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuma.rule=Host(`kuma.mew.lab`)"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    volumes:
      - /data/docker/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs/M2_SSD:ro
      - /data:/hostfs/HDD_1TB:ro
      - /ssd-data:/hostfs/SATA_SSD:ro
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - HOMEPAGE_ALLOWED_HOSTS=home.mew.lab,100.116.167.3,home.homelab.ts.net
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.mew.lab`)"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-homelab}
    volumes:
      - /data/docker/postgres/data:/var/lib/postgresql/data
    networks:
      - internal

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@mew.lab}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin123}
    volumes:
      - /data/docker/pgadmin/data:/var/lib/pgadmin
      - /data/docker/pgadmin/config/servers.json:/pgadmin4/servers.json:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.mew.lab`)"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=8080"

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres-backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DB=${POSTGRES_DB:-homelab}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - /data/docker/postgres/backups:/backups
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-admin123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - /data/docker/redis/data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:-a_very_secure_jwt_secret_for_homelab_sso_2026}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:-a_very_secure_session_secret_for_homelab_sso_2026}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY:-a_very_secure_storage_encryption_key_2026}
    volumes:
      - /data/docker/authelia/config:/config
    networks:
      - proxy
      - internal
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.authelia.rule=Host(`auth.mew.lab`)"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth"
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
