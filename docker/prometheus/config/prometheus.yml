# ==============================================================================
# PROMETHEUS / VICTORIAMETRICS SCRAPING CONFIGURATION
# Location: /data/docker/prometheus/config/prometheus.yml
# ==============================================================================
global:
  scrape_interval: 15s
  external_labels:
    cluster: 'homelab-mesh'
    datacenter: 'local-room'

scrape_configs:
  # 1. Scrape internal metrics engine performance
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['localhost:8428']

  # 2. Scrape physical bare-metal hardware CPU/RAM/Disk stats (Acer Aspire V13)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: 'homelab-server'
          type: 'linux-baremetal'

  # 3. Scrape real-time memory & network footprints of individual Docker containers
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          engine: 'docker-ce'

  # 4. Scrape ACASH Paper Engine operational metrics (E3.6 / WS9 / D13.1)
  - job_name: 'acash-paper'
    static_configs:
      - targets: ['acash-staging:9102']
        labels:
          tier: 'execution-infrastructure'
          mode: 'paper-staging'

  # 5. Scrape ACASH Shadow Alpha Tournament operational metrics
  - job_name: 'acash-shadow'
    static_configs:
      - targets: ['acash-shadow:9102']
        labels:
          tier: 'execution-infrastructure'
          mode: 'shadow-tournament'
